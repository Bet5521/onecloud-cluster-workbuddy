services:
  cloudflared:
    node: wk-edge-01
    container: true
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    ports: []
    env:
      TZ: Asia/Shanghai
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    volumes:
      - ./cloudflared:/etc/cloudflared
      - cloudflared-config:/root/.cloudflared
    restart: unless-stopped
    public_access:
      type: cloudflare-tunnel
      hostname: tunnel.yourdomain.com
      service: http://edge-01.lan:9000

  adguard:
    node: wk-edge-01
    container: true
    image: adguard/adguardhome:latest
    network_mode: host
    ports: []
    env:
      TZ: Asia/Shanghai
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
    restart: unless-stopped
    public_access:
      type: cloudflare-tunnel
      hostname: dns.yourdomain.com
      service: http://edge-01.lan:3000

  wireguard:
    node: wk-edge-01
    container: true
    image: linuxserver/wireguard:latest
    ports:
      - "51820:51820/udp"
    env:
      TZ: Asia/Shanghai
      PUID: "1000"
      PGID: "1000"
      SERVERURL: ${DOMAIN}
      SERVERPORT: "51820"
      PEERS: "3"
      ALLOWEDIPS: "10.8.0.0/24,192.168.1.0/24"
      LOG_CONFS: "true"
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  clash:
    node: wk-edge-01
    container: false
    binary: mihomo-linux-armv7
    port: 9090
    config_path: ./clash/config.yaml
    install_path: /usr/local/bin/mihomo
    memory_limit: 30MB

  memos:
    node: wk-edge-01
    container: true
    image: neosmemo/memos:stable
    ports:
      - "${MEMOS_PORT}:${MEMOS_PORT}"
    volumes:
      - ./memos/data:/var/opt/memos
    restart: unless-stopped
    env:
      TZ: Asia/Shanghai
      MEMOS_PORT: ${MEMOS_PORT}
      MEMOS_DRIVER: sqlite
    public_access:
      type: cloudflare-tunnel
      hostname: memos.yourdomain.com
      service: http://edge-01.lan:5230

  homeassistant:
    node: wk-iot-02
    container: true
    image: ghcr.io/adyoull/ha-armv7:latest
    ports:
      - "8123:8123"
    network_mode: host
    privileged: true
    volumes:
      - ./homeassistant:/config
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    memory_limit: 256MB
    public_access:
      type: cloudflare-tunnel
      hostname: home.yourdomain.com
      service: http://iot-02.lan:8123

  xiaomusic:
    node: wk-iot-02
    container: false
    binary: xiaomusic-linux-armv7
    port: 8081
    memory_limit: 60MB

  migpt:
    node: wk-iot-02
    container: false
    binary: migpt-linux-armv7
    port: 8082
    memory_limit: 40MB

  piwigo:
    node: wk-iot-02
    container: true
    image: linuxserver/piwigo:latest
    ports:
      - "8080:80"
    volumes:
      - ./piwigo/config:/config
      - ./piwigo/gallery:/gallery
    restart: unless-stopped
    public_access:
      type: cloudflare-tunnel
      hostname: photos.yourdomain.com
      service: http://iot-02.lan:8080

  syncthing:
    node: wk-storage-03
    container: true
    image: syncthing/syncthing:latest
    ports:
      - "8384:8384"
      - "22000:22000"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./syncthing/config:/var/syncthing/config
      - ./syncthing/data:/var/syncthing/data
    restart: unless-stopped
    env:
      TZ: Asia/Shanghai
      PUID: "1000"
      PGID: "1000"
      GUI_ADDRESS: 0.0.0.0:8384

  verysync:
    node: wk-storage-03
    container: false
    binary: verysync-linux-armv7
    port: 19900
    memory_limit: 50MB

  aria2:
    node: wk-storage-03
    container: true
    image: p3terx/aria2-pro:latest
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"
    env:
      TZ: Asia/Shanghai
      PUID: "1000"
      PGID: "1000"
      RPC_SECRET: ${ARIA2_RPC_SECRET}
      RPC_PORT: "6800"
      LISTEN_PORT: "6888"
      DISK_CACHE: 64M
      UPDATE_TRACKERS: "true"
    volumes:
      - ./aria2/config:/config
      - ./aria2/downloads:/downloads
    restart: unless-stopped

  cupsd:
    node: wk-storage-03
    container: true
    image: ousia/cupsd:armhf
    ports:
      - "631:631"
    env:
      TZ: Asia/Shanghai
      ADMIN_USER: ${CUPS_ADMIN_USER}
      ADMIN_PASSWORD: ${CUPS_ADMIN_PASSWORD}
    volumes:
      - ./cupsd/config:/etc/cups
      - ./cupsd/printers:/var/cups/printers
      - ./cupsd/spool:/var/spool/cups
    restart: unless-stopped

  cups-web:
    node: wk-storage-03
    container: true
    image: nkn-ts/cups-web:armhf
    ports:
      - "632:80"
    env:
      TZ: Asia/Shanghai
      CUPS_HOST: ${NODE_IP}
      CUPS_PORT: "631"
      CUPS_USER: ${CUPS_ADMIN_USER}
      CUPS_PASSWORD: ${CUPS_ADMIN_PASSWORD}
    restart: unless-stopped

  ariang:
    node: wk-storage-03
    container: true
    image: p3terx/ariang:latest
    ports:
      - "6880:80"
    env:
      TZ: Asia/Shanghai
    restart: unless-stopped

  panel:
    node: wk-edge-01
    container: false
    language: python3-flask
    port: 9000
    config_path: ./panel/config.json
    install_path: /usr/bin/python3 app.py
    public_access:
      type: cloudflare-tunnel
      hostname: panel.yourdomain.com
      service: http://edge-01.lan:9000