version: "3.8"

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    env_file: .env
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      - TZ=${TZ}
    volumes:
      - ./cloudflared:/etc/cloudflared
      - cloudflared-config:/root/.cloudflared
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    mem_limit: 64m

  adguard:
    image: adguard/adguardhome:latest
    container_name: adguard
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf
      - /etc/localtime:/etc/localtime:ro
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    mem_limit: 128m

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    env_file: .env
    ports:
      - "51820:51820/udp"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - SERVERURL=${DOMAIN}
      - SERVERPORT=51820
      - PEERS=3
      - ALLOWEDIPS=10.8.0.0/24,192.168.1.0/24
      - LOG_CONFS=true
    volumes:
      - ./wireguard/config:/config
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    mem_limit: 64m

  memos:
    image: neosmemo/memos:stable
    container_name: memos
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ}
      - MEMOS_PORT=${MEMOS_PORT}
      - MEMOS_DRIVER=sqlite
    ports:
      - "5230:5230"
    volumes:
      - ./memos/data:/var/opt/memos
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    mem_limit: 96m

volumes:
  cloudflared-config:
